name: mstocks-arena

x-app: &app
  image: mstocks-arena:${APP_RELEASE:?Set APP_RELEASE to the approved Git commit}
  build:
    context: ../..
    dockerfile: deploy/lightsail/Dockerfile
    args:
      TYPECHECK_HEAP_MB: ${TYPECHECK_HEAP_MB:-280}
  env_file:
    - ${MSTOCKS_ENV_FILE:-/etc/mstocks-arena/.env}
  environment:
    NODE_ENV: production
    NODE_OPTIONS: --max-old-space-size=192
    PORT: "8787"
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *app
    command: [migrate]
    restart: "no"
    mem_limit: 256m
  api:
    <<: *app
    command: [api]
    restart: unless-stopped
    mem_limit: 320m
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 96m
    env_file:
      - ${MSTOCKS_PUBLIC_ENV_FILE:-/etc/mstocks-arena/public.env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
